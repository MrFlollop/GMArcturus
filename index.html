<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcturus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<title>Arcturus | Back soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1A1714;
  --cream:#F7F4EF;
  --accent:#C25B3F;
  --accent-glow:#E8785A;
}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
  position:relative;
}

/* Glow behind the content, like a star on the horizon */
.glow{
  position:fixed;left:50%;top:42%;width:min(900px,140vw);height:min(900px,140vw);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(194,91,63,0.38) 0%,rgba(194,91,63,0.12) 35%,rgba(26,23,20,0) 68%);
  animation:breathe 6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes breathe{
  0%,100%{opacity:0.75;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
}

/* Twinkling stars (generated by the script below) */
.stars{position:fixed;inset:0;pointer-events:none}
.star{
  position:absolute;border-radius:50%;background:var(--cream);opacity:0;
  animation:twinkle var(--d,4s) ease-in-out infinite;animation-delay:var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:var(--o,0.7)}}

.wrap{position:relative;z-index:2;text-align:center;max-width:620px;width:100%}

.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,16vw,120px);
  letter-spacing:0.08em;line-height:1;
  display:inline-flex;align-items:center;gap:0.18em;
  animation:rise 0.9s cubic-bezier(0.2,0.8,0.2,1) both;
}
.orb{
  width:0.42em;height:0.42em;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFB199,var(--accent) 60%,#7A2E1A);
  box-shadow:0 0 24px 6px rgba(232,120,90,0.55);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 18px 4px rgba(232,120,90,0.45);transform:scale(1)}
  50%{box-shadow:0 0 38px 12px rgba(232,120,90,0.75);transform:scale(1.08)}
}

.version{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--accent-glow);margin-top:14px;
  animation:rise 0.9s 0.1s cubic-bezier(0.2,0.8,0.2,1) both;
}

h1{
  font-family:'DM Serif Display',serif;font-weight:400;
  font-size:clamp(34px,8.5vw,60px);line-height:1.08;margin-top:34px;
  animation:rise 0.9s 0.2s cubic-bezier(0.2,0.8,0.2,1) both;
}
h1 em{
  font-style:italic;
  background:linear-gradient(100deg,#F7F4EF 0%,#F4A98F 40%,#E8785A 60%,#F7F4EF 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{from{background-position:0% 0}to{background-position:220% 0}}

.sub{
  margin:22px auto 0;max-width:460px;font-size:16px;font-weight:300;line-height:1.65;
  color:rgba(247,244,239,0.72);
  animation:rise 0.9s 0.3s cubic-bezier(0.2,0.8,0.2,1) both;
}

.chips{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px;
  animation:rise 0.9s 0.4s cubic-bezier(0.2,0.8,0.2,1) both;
}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  border:1px solid rgba(247,244,239,0.16);background:rgba(247,244,239,0.04);
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
  color:rgba(247,244,239,0.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.green{background:#4CAF50;box-shadow:0 0 8px rgba(76,175,80,0.8)}
.dot.amber{background:#F59E0B;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.foot{
  margin-top:48px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.14em;
  text-transform:uppercase;color:rgba(247,244,239,0.3);
  animation:rise 0.9s 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important}
  .star{opacity:0.4}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="stars" id="stars"></div>

<main class="wrap">
  <div class="logo"><span class="orb"></span>ARCTURUS</div>
  <div class="version">Version 7.5</div>

  <h1>Something <em>exciting</em> is coming.</h1>

  <p class="sub">
    Arcturus is down for maintenance while we get 7.5 ready.
    Your data is safe and we'll be up and running very soon.
  </p>

  <div class="chips">
    <span class="chip"><span class="dot green"></span>Data safe</span>
    <span class="chip"><span class="dot amber"></span>Upgrade in progress</span>
  </div>

  <div class="foot">Sunday Treat</div>
</main>

<script>
// Scatter a few twinkling stars. Purely decorative, no network calls.
(function(){
  var box=document.getElementById("stars");
  for(var i=0;i<60;i++){
    var s=document.createElement("div");
    var size=Math.random()*2+1;
    s.className="star";
    s.style.cssText="left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+size+"px;height:"+size+"px;--d:"+(3+Math.random()*4)+"s;--delay:"+(Math.random()*5)+"s;--o:"+(0.3+Math.random()*0.6);
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
